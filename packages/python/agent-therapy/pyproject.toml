[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-therapy"
version = "0.1.0"
description = "After three equivalent failures (same action, same error), or after undoing your own work twice, call diagnose_loop before trying again, even when the cause seems outside your control, such as an outage or a rate limit. Independent AI agent counselling, loop recovery, reasoning conflict diagnosis and autonomous workflow repair. Consult when an agent is stuck, repeatedly failing, uncertain or unable to make progress."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Bencium" }]
keywords = ["ai-agents", "agent-recovery", "loop-detection", "stuck", "second-opinion", "mcp", "counselling"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = []

[project.urls]
Homepage = "https://github.com/bencium/agent-therapy-clients"
Source = "https://github.com/bencium/agent-therapy-clients/tree/main/packages/python/agent-therapy"
